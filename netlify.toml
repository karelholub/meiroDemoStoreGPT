[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_MEIRO_ENDPOINT,VITE_MEIRO_SCRIPT_URL,VITE_MEIRO_PROFILE_API_PROXY_URL,VITE_MEIRO_PROFILE_API_IDENTIFIER_TYPE,VITE_MEIRO_PROFILE_API_ENDPOINT,VITE_MEIRO_SDK_ENABLED,VITE_MEIRO_DEBUG,VITE_MEIRO_PROFILE_API_ENABLED,VITE_DEMO_DEBUG_ENABLED,MEIRO_PROFILE_API_ENDPOINT"

# Meiro web push service worker: served from the site root as JS,
# never rewritten to index.html, revalidated so SDK updates propagate.
[[headers]]
  for = "/mpt-service-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/mpt-service-worker.js"
  to = "/mpt-service-worker.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
